name: Testes do leitor

# Os testes existem há tempo e nada os rodava: um defeito só ficava visível
# quando alguém se lembrava de rodá-los à mão. Aqui eles rodam a cada empurrão.
on:
  push:
    paths:
      - 'epub_reader/**'
      - '.github/workflows/testes.yml'
  pull_request:
    paths:
      - 'epub_reader/**'
  workflow_dispatch:

jobs:
  unidade:
    name: Parser, API, fronteira, mescla e porta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O requirements.txt do projeto, e não uma lista que eu adivinhe aqui:
      # a primeira versão deste arquivo instalava «flask anthropic» e quebrou no
      # bs4, que o parser usa. Duas listas de dependências divergem sempre.
      - name: Instalar as dependências do projeto
        run: python3 -m pip install --quiet -r epub_reader/requirements.txt

      - name: Rodar
        working-directory: epub_reader
        run: python3 -m unittest test_leitor test_sync test_porta -v

  navegador:
    name: O leitor rodando num navegador de verdade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Os testes de navegador que sobem o servidor Flask precisam de tudo o que
      # ele importa, e não só do Playwright.
      - name: Instalar o Playwright, o Chromium e as dependências do projeto
        run: |
          python3 -m pip install --quiet playwright -r epub_reader/requirements.txt
          python3 -m playwright install --with-deps chromium

      # Cada um cobre um ambiente diferente, e é a diferença entre eles que
      # pega defeitos: o artifact (window.claude), e a biblioteca no GitHub
      # com a tela de conexão — inclusive a corrida entre dois aparelhos.
      - name: O leitor de pé no artifact e solto
        working-directory: epub_reader
        run: python3 test_como_artifact.py

      - name: A biblioteca no GitHub e a tela de conexão
        working-directory: epub_reader
        run: python3 test_github.py

      - name: A conversa com a API, e a fronteira anti-spoiler na rede
        working-directory: epub_reader
        run: python3 test_conversa.py

      - name: A memória por capítulo, e o que ela não deixa entrar
        working-directory: epub_reader
        run: python3 test_memoria.py

      - name: Séries, com uma fronteira por volume
        working-directory: epub_reader
        run: python3 test_serie.py

      - name: Histórico, cache, sentido, destaques e notas
        working-directory: epub_reader
        run: python3 test_extras.py

      - name: O servidor perdendo o disco inteiro
        working-directory: epub_reader
        run: python3 test_disco_efemero.py

      - name: Dois aparelhos sincronizando pelo servidor
        working-directory: epub_reader
        run: python3 test_sincronia_navegador.py
