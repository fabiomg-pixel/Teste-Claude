name: Página do leitor

# Publica o leitor num endereço fixo do GitHub Pages. É o que o artifact nunca
# vai poder ser: uma origem https comum, onde o IndexedDB guarda a estante, o
# «Adicionar à Tela de Início» funciona, e a sincronização com um servidor é
# possível — a política de segurança do artifact bloqueia qualquer uma dessas.
#
# O deploy vai para a branch gh-pages em vez de usar o ambiente github-pages:
# aquele restringe deploys à branch padrão do repositório, que aqui é outro
# projeto. Assim isto funciona de qualquer branch.

on:
  workflow_dispatch:
  push:
    branches: [claude/epub-reader-llm-integration-h7tvtn]
    paths:
      - 'epub_reader/leitor-celular.html'
      - 'epub_reader/moldura-celular.html'
      - 'epub_reader/pagina.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Montar e publicar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Montar a página
        run: |
          set -e
          mkdir -p site
          python epub_reader/pagina.py site/index.html
          # Sem isto o Pages passa o conteúdo pelo Jekyll, que come arquivos
          # começados por underscore e pode mexer no que não deve.
          touch site/.nojekyll
          cp epub_reader/leitor-celular.html site/leitor-fragmento.html

      - name: Conferir o que vai ao ar
        run: |
          set -e
          test -s site/index.html
          head -c 15 site/index.html | grep -qi '<!doctype html>'
          grep -q 'width=device-width' site/index.html
          grep -q 'apple-mobile-web-app-capable' site/index.html
          grep -q '__leitorFalhou' site/index.html
          grep -oE 'const VERSAO = [0-9]+' site/index.html
          echo "tamanho: $(wc -c < site/index.html) bytes"

      - name: Publicar na branch gh-pages
        run: |
          set -e
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Leitor publicado de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      # Apontar o Pages para gh-pages é uma configuração de repositório, e
      # empurrar a branch não a cria. Sem isto o endereço responde 404 e o
      # deploy parece ter funcionado — o pior dos dois mundos. Idempotente: se
      # já estiver ligado, só informa o endereço.
      - name: Ligar o Pages, se ainda não estiver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api="https://api.github.com/repos/$REPO/pages"
          pedir() { curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          codigo=$(pedir -o /tmp/pages.json -w '%{http_code}' "$api")
          if [ "$codigo" = "404" ]; then
            echo "O Pages ainda não existe. Ligando na branch gh-pages…"
            criado=$(pedir -o /tmp/criar.json -w '%{http_code}' -X POST "$api" \
                       -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "criação: HTTP $criado"; cat /tmp/criar.json; echo
            if [ "$criado" != "201" ]; then
              echo "::warning::Não consegui ligar o Pages pela API (HTTP $criado); ligue em Settings -> Pages -> Deploy from a branch -> gh-pages / (root)"
              exit 0
            fi
          else
            echo "O Pages já estava ligado (HTTP $codigo)."
          fi

          pedir -o /tmp/pages.json "$api" || true
          python3 -c "import json;d=json.load(open('/tmp/pages.json'));print('ENDERECO DO LEITOR:',d.get('html_url'));print('estado:',d.get('status'),'| fonte:',d.get('source'))"
