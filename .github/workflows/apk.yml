name: APK do leitor

# Este ambiente de desenvolvimento não alcança o dl.google.com, então o APK é
# compilado aqui: o runner do GitHub já vem com o SDK do Android.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'epub_reader/leitor-celular.html'
      - 'epub_reader/moldura-celular.html'
      - '.github/workflows/apk.yml'

permissions:
  contents: write   # para publicar o APK como release

jobs:
  montar:
    name: Compilar o APK de depuração
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guardar o cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Conferir o que saiu
        working-directory: android
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          # o leitor precisa ter entrado nos assets do pacote…
          unzip -l "$APK" | grep -q 'assets/leitor.html'
          # …já dentro da moldura: sem doctype o WebView renderiza em modo
          # quirks, e sem o viewport a página não se ajusta à tela
          unzip -p "$APK" assets/leitor.html > /tmp/leitor.html
          head -c 15 /tmp/leitor.html | grep -qi '<!doctype html>'
          grep -q 'width=device-width' /tmp/leitor.html
          echo "APK pronto."

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: leitor-sem-spoiler-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Artefato do Actions só se baixa logado e vem dentro de um zip — ruim
      # no celular. A release dá um link direto, que o navegador do Android
      # abre e instala.
      - name: Publicar o APK como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk leitor-sem-spoiler.apk
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release create apk leitor-sem-spoiler.apk \
            --target "$GITHUB_SHA" \
            --title "Leitor sem spoiler — APK" \
            --notes "APK de depuração, gerado do commit \`${GITHUB_SHA:0:7}\`.

          Baixe o \`leitor-sem-spoiler.apk\` abaixo e toque no arquivo no Android.
          O sistema vai pedir para permitir a instalação de fontes desconhecidas —
          é o aviso normal de instalar fora da Play Store."
