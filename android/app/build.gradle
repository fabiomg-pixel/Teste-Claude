plugins {
    id 'com.android.application'
}

android {
    namespace 'br.leitor.semspoiler'
    compileSdk 34

    defaultConfig {
        applicationId "br.leitor.semspoiler"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // O leitor é o mesmo arquivo publicado na web: copiado para os assets no
    // build, para não existirem duas cópias divergindo.
    sourceSets {
        main {
            assets.srcDirs += "${layout.buildDirectory.get().asFile}/leitor"
        }
    }
}

dependencies {
    // WebViewAssetLoader: serve os assets por https://appassets.androidplatform.net,
    // uma origem segura — em file:// o IndexedDB não funciona e a estante não
    // sobreviveria ao fechamento do app.
    implementation 'androidx.webkit:webkit:1.11.0'
}

// O leitor é um fragmento (é assim que ele vai publicado como artifact, onde o
// <head> quem põe é o publicador). Aqui, como no /celular do servidor, ele
// entra na moldura: doctype, charset, viewport e as metas de tela cheia.
tasks.register('copiarLeitor') {
    def fragmento = file("${rootDir}/../epub_reader/leitor-celular.html")
    def moldura = file("${rootDir}/../epub_reader/moldura-celular.html")
    def destino = file("${layout.buildDirectory.get().asFile}/leitor/leitor.html")
    inputs.files(fragmento, moldura)
    outputs.file(destino)
    doLast {
        def texto = moldura.getText('UTF-8')
        assert texto.contains('<!--LEITOR-->') : 'moldura-celular.html sem <!--LEITOR-->'
        destino.parentFile.mkdirs()
        destino.write(texto.replace('<!--LEITOR-->', fragmento.getText('UTF-8')), 'UTF-8')
    }
}

tasks.named('preBuild') { dependsOn 'copiarLeitor' }
